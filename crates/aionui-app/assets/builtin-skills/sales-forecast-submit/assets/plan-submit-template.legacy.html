<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI 销售计划提报 - 模板页（MCP 数据驱动）</title>
  <style>
    :root{--red:#d5001c;--ink:#172033;--muted:#78869a;--line:#e4e8ef;--paper:#fff;--panel:#f7f8fa;--green:#16a475;--gold:#a76b11;--navy:#1b2638}
    *{box-sizing:border-box}
    body{margin:0;background:#f8f6f5;color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    button,input,select{font:inherit}button{cursor:pointer}

    /* ===== 工作台（无顶部平台栏，全宽） ===== */
    .workspace{overflow:auto;background:#f6f7f9;min-height:100vh}
    .btn{height:36px;padding:0 14px;border:1px solid #dce2ea;border-radius:8px;background:#fff;color:#263244;font-weight:650;white-space:nowrap}
    .btn:hover{border-color:var(--red);color:var(--red)}
    .btn-submit{border-color:var(--navy);background:var(--navy);color:#fff}
    .btn-submit:hover{border-color:var(--navy);background:#263950;color:#fff}
    .plan-switch{display:flex;overflow:hidden;border:1px solid #dce2ea;border-radius:8px;background:#fff}
    .plan-switch button{height:38px;padding:0 15px;border:0;background:transparent;color:#a6afbd;font-weight:700;transition:.15s}
    .plan-switch button:hover{color:#d5001c}
    .plan-switch button.active{margin:3px;border-radius:6px;background:var(--red);color:#fff}
    .query-row{display:flex;align-items:center;gap:16px;padding:14px 32px;flex-wrap:wrap;border-bottom:1px solid var(--line);background:#fff}
    .query-row label{color:#5b6a80;font-weight:650;white-space:nowrap}
    .q-item{display:flex;align-items:center;gap:8px}
    .field{display:flex;gap:10px;flex-wrap:wrap}
    .select{height:38px;padding:0 12px;border:1px solid #dde3eb;border-radius:8px;background:#fff;color:#263244;outline:0}
    .select:focus{border-color:var(--red)}
    .select.wide{min-width:230px}
    .select.month{width:150px}

    /* 顶部 4 步提报进度 */
    .steps{display:flex;align-items:center;gap:0;padding:20px 32px;border-bottom:1px solid var(--line);background:#fff;overflow-x:auto}
    .steps-title{margin-right:22px;padding-right:22px;border-right:1px solid var(--line);font-size:18px;font-weight:800;letter-spacing:-.4px;white-space:nowrap}
    .step{display:flex;align-items:center;gap:9px;white-space:nowrap}
    .step .dot{display:grid;width:26px;height:26px;place-items:center;border-radius:50%;font-size:13px;font-weight:800;font-style:normal;transition:.2s}
    .step .name{font-weight:700;font-size:14px}
    .step.todo .dot{background:#eef1f5;color:#98a2b3}
    .step.todo .name{color:#98a2b3}
    .step.done .dot{background:#2da77e;color:#fff}
    .step.done .name{color:#2da77e}
    .step.current .dot{background:var(--red);color:#fff;box-shadow:0 0 0 4px rgba(213,0,28,.13)}
    .step.current .name{color:var(--red)}
    .connector{width:34px;height:2px;margin:0 12px;border-radius:1px;background:#dde3ec;flex:none}
    .connector.done{background:#2da77e}

    .content{padding:20px 32px}
    .sku-card{overflow:hidden;border:1px solid #dfe5ed;border-radius:11px;background:#fff}
    .sku-toolbar{padding:12px;border-bottom:1px solid #e5eaf0;background:#f9fafb}
    .sku-title-row{display:flex;align-items:center;gap:10px}
    .sku-title-row h2{margin:0;font-size:16px}
    .src-badge{padding:4px 9px;border:1px solid #bcd7f0;border-radius:7px;background:#f2f8fe;color:#2f6fbf;font-size:12px;font-weight:700}
    .adjusted{padding:6px 10px;border:1px solid #e7a1a8;border-radius:7px;background:#fff7f7;color:#c14751;font-weight:700}
    .filter-row{display:flex;gap:9px;flex-wrap:wrap;margin-top:11px}
    .search{flex:1;min-width:200px;height:39px;padding:0 13px;border:1px solid #d9e0e9;border-radius:8px;outline:0}
    .filter{height:39px;padding:0 10px;border:1px solid #d9e0e9;border-radius:8px;background:#fff;color:#263244}
    .table-wrap{overflow:auto}
    .sku-card table{width:100%;min-width:1050px;border-collapse:collapse}
    .sku-card th{height:43px;color:#65748a;background:#f4f6f9;font-size:12px;font-weight:650;text-align:center}
    .sku-card td{padding:12px;border-top:1px solid #e7ebf0;text-align:center}
    .sku-card th:first-child,.sku-card td:first-child{min-width:280px;padding-left:14px;text-align:left}
    .product{font-size:14px;font-weight:750}
    .product small{display:block;margin-top:3px;color:#818d9e;font-weight:500}
    .categ{display:inline-block;padding:3px 8px;border:1px solid #dde4ee;border-radius:6px;background:#f6f8fb;color:#516074;font-size:12px;font-weight:650}
    .common{color:#4072bb;font-size:12px;font-weight:700}
    .prob{font-weight:700}
    .prob.high{color:#2f8a68}.prob.mid{color:#a76b11}.prob.low{color:#b52b31}.prob.na{color:#98a2b3}
    .plan-number{font-weight:750}
    .edit{width:98px;height:38px;border:1px solid #d4dce6;border-radius:8px;color:#ba3a43;text-align:center;font-weight:750}
    .edit.dirty{border-color:#e7a1a8;background:#fff7f7}
    .amount{display:block;margin-top:4px;color:#8a94a4;font-size:12px}
    .pagination{display:flex;align-items:center;gap:10px;padding:12px;color:#69778b;font-size:12px}
    .pagination select{height:34px;padding:0 9px;border:1px solid #d8dfe8;border-radius:8px;background:#fff}

    .toast{position:fixed;right:20px;bottom:20px;display:none;padding:13px 15px;border:1px solid #cae5d9;border-radius:10px;background:#f2fbf6;color:#176546;box-shadow:0 8px 24px rgb(0 0 0 / 8%);max-width:360px}
    .toast.show{display:block}
    .toast.err{border-color:#e8c3c7;background:#fdf3f4;color:#a1333b}

    @media(max-width:600px){.content{padding-top:14px}.query-row,.steps,.content{padding-left:18px;padding-right:18px}.query-row .field{margin-left:0}}
  </style>
</head>
<body>
  <main class="workspace" aria-label="AI 销售计划提报工作台">
    <!-- 顶部：4 步提报进度 -->
    <nav class="steps" aria-label="提报流程状态">
      <span class="steps-title">AI 销售计划提报</span>
      <span class="step done"><i class="dot">✓</i><span class="name">经销商数据获取</span></span>
      <span class="connector done"></span>
      <span class="step done"><i class="dot">✓</i><span class="name">AI 预测生成</span></span>
      <span class="connector done"></span>
      <span class="step current"><i class="dot">3</i><span class="name">计划提报</span></span>
      <span class="connector"></span>
      <span class="step todo"><i class="dot">4</i><span class="name">提交 DMS 草稿</span></span>
    </nav>

    <!-- 筛选区：计划类型 / 省区 / 经销商 / 月份（数据由 MCP 查询填充，不可手填） -->
    <div class="query-row">
      <div class="plan-switch" id="planSwitch">
        <button data-plan="月初计划" class="active">月初计划</button>
        <button data-plan="纠偏计划">纠偏计划</button>
      </div>
      <span class="q-item"><label for="provinceSelect">销售省区</label><select class="select wide" id="provinceSelect" aria-label="销售省区"></select></span>
      <span class="q-item"><label for="dealerSelect">经销商</label><select class="select wide" id="dealerSelect" aria-label="经销商"></select></span>
      <span class="q-item"><label for="monthSelect">计划月份</label><select class="select month" id="monthSelect" aria-label="计划月份"></select></span>
      <div class="field" style="margin-left:auto">
        <button class="btn" id="approval">☑　销售计划审批</button>
        <button class="btn btn-submit" id="submit">提交</button>
      </div>
    </div>

    <section class="content">
      <section class="sku-card" aria-labelledby="sku-title">
        <div class="sku-toolbar">
          <div class="sku-title-row">
            <h2 id="sku-title">SKU 预测明细</h2>
            <span class="src-badge">MCP · agents_sales_forecast_detail</span>
            <span class="adjusted" id="adjusted">已调整 0 条</span>
          </div>
          <div class="filter-row">
            <input id="skuSearch" class="search" placeholder="⌕　搜索 SKU 编码或名称" />
            <select id="category" class="filter"><option value="">全部品类</option></select>
            <select id="confidence" class="filter"><option value="">全部置信度</option></select>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>SKU / 产品</th><th>品类</th><th>命中把握</th><th>发货概率</th>
                <th>AI预测金额</th><th>AI预测数量</th><th>确认计划数量</th><th>确认金额</th>
              </tr>
            </thead>
            <tbody id="skuRows"></tbody>
          </table>
        </div>
        <div class="pagination" id="pagination"></div>
      </section>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <script>
  /* =====================================================================
   *  AI 销售计划提报 - 模板页（MCP 数据驱动）
   *  ---------------------------------------------------------------------
   *  说明：
   *  1) 页面无左侧对话栏，只保留右侧「用户交互工作台」。
   *  2) 数据禁止自由填写，全部由 MCP 查询后填充：
   *      选省区 → MCP 查该省区经销商列表 → 填充经销商下拉
   *      选经销商 → MCP 查该经销商 SKU 预测明细 → 填充表格
   *  3) 唯一可人工介入的列是「确认计划数量」（默认 = AI 预测数量），
   *     修改后实时重算确认金额。
   *  4) 提报接口已预留（API_CONFIG.submitUrl），点击「提交」组装 payload。
   *
   *  ---------- MCP 语义模型字段映射（Cube: agents_sales_forecast_detail） ----------
   *  省区        province_region_name / province_region_code   （豫南经销省区 / 豫北经销直管区 …）
   *  经销商      dealer_code / dealer_name
   *  SKU        sku_code / sku_name
   *  品类        product_categ_name                             （饺子 / 馄饨 / 粽子 / 面点 …）
   *  命中把握    hit_confidence                               （高/中/低，勿用发货概率阈值映射）
   *  发货概率    delivery_probability                          （SKU 明细数值，0~1，可为 null）
   *  预测金额    predicted_sales_amount                         （权威预测金额）
   *  预测数量    predicted_quantity
   *  计划月份    plan_month                                     （YYYYMM，如 202608）
   *
   *  ---------- 后端需封装的 MCP 查询（Cube JSON Query 示例） ----------
   *  ① 查省区经销商列表：
   *     { measures:["agents_sales_forecast_detail.predicted_sales_amount",
   *                  "agents_sales_forecast_detail.predicted_quantity"],
   *       dimensions:["agents_sales_forecast_detail.dealer_code",
   *                   "agents_sales_forecast_detail.dealer_name"],
   *       filters:[{member:"agents_sales_forecast_detail.province_region_name",
   *                 operator:"equals", values:[省区名]}],
   *       order:{ "agents_sales_forecast_detail.predicted_sales_amount":"desc" } }
   *  ② 查经销商 SKU 明细：
   *     在上例基础上再叠加
   *     filters:[{member:"...dealer_code",operator:"equals",values:[经销商编码]},
   *              {member:"...plan_month",operator:"equals",values:[YYYYMM]}],
   *     dimensions 增加 sku_code / sku_name / product_categ_name / hit_confidence / delivery_probability
   * ===================================================================== */

  /* ---------- ① 接口预留配置 ---------- */
  const API_CONFIG = {

    fetchProvinceDealersUrl: '',   // 例：'/api/forecast/province-dealers'

    submitUrl: '',                 // 例：'/api/sales-plan/submit' 或外部 DMS 提报地址

  /* ---------- ③ 运行时状态 ---------- */
  const state = {
    planType: '月初计划',
    province: SNAPSHOT.provinces[0].name,
    dealerCode: null,
    month: SNAPSHOT.months[0],
    skus: [],           // 当前经销商 SKU 明细
    dealer: null,       // 当前经销商
  };

  /* ---------- ④ DOM 引用 ---------- */
  const $ = (id) => document.getElementById(id);

  /* ---------- ⑤ 数据获取（MCP 接口预留） ---------- */
  async function fetchProvinceDealers(province, month) {
    if (API_CONFIG.fetchProvinceDealersUrl) {
      const res = await fetch(API_CONFIG.fetchProvinceDealersUrl, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ province, month }),
      });
      if (!res.ok) throw new Error('经销商查询失败：' + res.status);
      return res.json();   // 期望 [{code,name,amount,qty}]
    }
    return (SNAPSHOT.dealersByProvince[province] || []).map(d => ({ ...d }));
  }

  async function fetchDealerSkus(dealerCode, month) {
    if (API_CONFIG.fetchDealerSkusUrl) {
      const res = await fetch(API_CONFIG.fetchDealerSkusUrl, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ dealerCode, month }),
      });
      if (!res.ok) throw new Error('SKU 查询失败：' + res.status);
      return res.json();   // 期望 [{code,name,categ,confidence,prob,amount,qty}]
    }
    const list = SNAPSHOT.skuByDealer[dealerCode];
    if (!list || !list.length) {
      throw new Error('快照中无该经销商 SKU 数据，请配置 fetchDealerSkusUrl 后经 MCP 查询。');
    }
    return list.map(s => ({ ...s, confirmQty: s.qty }));
  }

  /* ---------- ⑥ 渲染 ---------- */
  function unitPriceOf(sku) { return sku.qty ? sku.amount / sku.qty : 0; }
  function confirmAmountOf(sku) { return Math.round((sku.confirmQty ?? sku.qty) * unitPriceOf(sku)); }

  function probClass(p) {
    if (p == null) return 'na';
    return '';   // 发货概率只展示数值，高/中/低配色交给命中把握
  }
  function probText(p) {
    if (p == null) return '—';
    return (p*100).toFixed(1) + '%';
  }
  function confClass(c) {
    if (c === '高') return 'high';
    if (c === '中') return 'mid';
    if (c === '低') return 'low';
    return 'na';
  }
  function confText(c) {
    if (c === '高' || c === '中' || c === '低') return c;
    return '未知';
  }

  function renderRows() {
    const key = $('skuSearch').value.trim().toLowerCase();
    const cat = $('category').value, conf = $('confidence').value;

    const categs = [...new Set(state.skus.map(s => s.categ))];
    $('category').innerHTML = '<option value="">全部品类</option>' + categs.map(c => `<option value="${c}">${c}</option>`).join('');
    const confs = [...new Set(state.skus.map(s => confText(s.confidence)))];
    $('confidence').innerHTML = '<option value="">全部置信度</option>' + confs.map(c => `<option value="${c}">${c}</option>`).join('');

    const rows = state.skus.filter(s => {
      const text = (s.name + s.code + s.categ).toLowerCase();
      if (key && !text.includes(key)) return false;
      if (cat && s.categ !== cat) return false;
      if (conf && confText(s.confidence) !== conf) return false;
      return true;
    });

    $('skuRows').innerHTML = rows.map(s => {
      const cq = s.confirmQty ?? s.qty;
      const ca = confirmAmountOf(s);
      return `<tr data-code="${s.code}">
        <td class="product">♨ ${s.name}<small>${s.code}</small></td>
        <td><span class="categ">${s.categ}</span></td>
        <td><span class="prob ${confClass(s.confidence)}">${confText(s.confidence)}</span></td>
        <td><span class="prob ${probClass(s.prob)}">${probText(s.prob)}</span></td>
        <td class="plan-number">¥${Math.round(s.amount).toLocaleString()}</td>
        <td class="plan-number">${Math.round(s.qty).toLocaleString()}</td>
        <td><input class="edit" value="${cq}" inputmode="numeric" data-code="${s.code}" /><small class="amount" data-code="${s.code}">按 AI预测，建议金额 ¥${Math.round(s.amount).toLocaleString()}</small></td>
        <td class="plan-number">¥${ca.toLocaleString()}</td>
      </tr>`;
    }).join('') || '<tr><td colspan="8" style="padding:28px;color:#98a2b3">暂无匹配的 SKU</td></tr>';

    $('skuRows').querySelectorAll('.edit').forEach(inp => inp.addEventListener('input', () => onEdit(inp)));
  }

  function onEdit(input) {
    const code = input.dataset.code;
    const sku = state.skus.find(s => s.code === code);
    const val = parseInt(input.value, 10);
    sku.confirmQty = Number.isFinite(val) ? val : 0;
    input.classList.toggle('dirty', sku.confirmQty !== sku.qty);
    // 实时重算该行确认金额
    const tr = input.closest('tr');
    tr.cells[7].textContent = '¥' + confirmAmountOf(sku).toLocaleString();
    refreshAdjusted();
  }

  function refreshAdjusted() {
    const n = state.skus.filter(s => (s.confirmQty ?? s.qty) !== s.qty).length;
    $('adjusted').textContent = `已调整 ${n} 条`;
  }

  function renderPagination() {
    $('pagination').innerHTML = `第 1 / 1 页　显示 1–${state.skus.length} 条，共 ${state.skus.length} 个SKU　每页 <select><option>10 条</option></select>`;
  }

  /* ---------- ⑦ 交互 ---------- */
  function initSelectors() {
    // 省区
    const p = $('provinceSelect');
    p.innerHTML = SNAPSHOT.provinces.map(x => `<option value="${x.name}">${x.name}</option>`).join('');
    p.value = state.province;
    p.addEventListener('change', async () => {
      state.province = p.value;
      await reloadDealers();
    });

    // 月份
    const m = $('monthSelect');
    m.innerHTML = SNAPSHOT.months.map(x => `<option>${x}</option>`).join('');
    m.value = state.month;
    m.addEventListener('change', async () => { state.month = m.value; await reloadDealers(); });

    // 经销商
    $('dealerSelect').addEventListener('change', async () => {
      state.dealerCode = $('dealerSelect').value;
      await reloadSkus();
    });

    // 计划类型切换（复用同一数据链路，后续可区分版本）
    document.querySelectorAll('#planSwitch button').forEach(b => {
      b.addEventListener('click', () => {
        document.querySelectorAll('#planSwitch button').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        state.planType = b.dataset.plan;
        reloadDealers();
      });
    });

    $('skuSearch').addEventListener('input', renderRows);
    $('category').addEventListener('change', renderRows);
    $('confidence').addEventListener('change', renderRows);
  }

  async function reloadDealers() {
    try {
      const dealers = await fetchProvinceDealers(state.province, state.month);
      const sel = $('dealerSelect');
      sel.innerHTML = dealers.map(d => `<option value="${d.code}">${d.name}（${d.code}）</option>`).join('')
        || '<option value="">（该省区暂无经销商）</option>';
      if (dealers.length) {
        state.dealerCode = dealers[0].code;
        state.dealer = dealers[0];
      } else {
        state.dealerCode = null; state.dealer = null; state.skus = [];
        renderEmpty(); return;
      }
      await reloadSkus();
    } catch (e) { toast(e.message, true); }
  }

  async function reloadSkus() {
    try {
      state.dealer = (SNAPSHOT.dealersByProvince[state.province] || []).find(d => d.code === state.dealerCode)
        || (await fetchProvinceDealers(state.province, state.month)).find(d => d.code === state.dealerCode)
        || { code: state.dealerCode, name: state.dealerCode };
      state.skus = await fetchDealerSkus(state.dealerCode, state.month);
      renderAll();
    } catch (e) { toast(e.message, true); renderEmpty(); }
  }

  function renderAll() {
    renderRows();
    refreshAdjusted();
    renderPagination();
  }
  function renderEmpty() {
    state.skus = [];
    $('skuRows').innerHTML = '<tr><td colspan="8" style="padding:28px;color:#98a2b3">暂无数据</td></tr>';
    refreshAdjusted(); renderPagination();
  }

  /* ---------- ⑧ 提报（接口预留） ---------- */
  function collectTableData() {
    return {
      planType: state.planType,
      month: state.month,
      province: state.province,
      dealer: { code: state.dealerCode, name: state.dealer?.name },
      skus: state.skus.map(s => ({
        skuCode: s.code, skuName: s.name, category: s.categ,
        hitConfidence: s.confidence,
        deliveryProbability: s.prob,
        aiAmount: s.amount, aiQty: s.qty,
        confirmQty: s.confirmQty ?? s.qty,
        confirmAmount: confirmAmountOf(s),
      })),
      submittedAt: new Date().toISOString(),
    };
  }

  async function submitToSystem() {
    const payload = collectTableData();
    if (!API_CONFIG.submitUrl) {
      console.log('[提报预留] 未配置 submitUrl，模拟提报 payload：', payload);
      toast('接口未配置，已模拟提报（见控制台 payload）。');
      return;
    }
    try {
      const res = await fetch(API_CONFIG.submitUrl, {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload),
      });
      if (!res.ok) throw new Error('提报失败：' + res.status);
      toast('提报成功，已提交至其他系统。');
    } catch (e) { toast(e.message, true); }
  }

  /* ---------- ⑨ Agent 桥接（页面 ↔ Agent 通信协议） ----------
   *  页面事件 → Agent 的通道，配合 chrome-devtools / aionui-browser MCP 使用。
   *  页面侧职责：
   *    1) 用 console.log 输出 `[bridge:event]` 前缀信号（Agent 用 get_console_message / list_console_messages 读）
   *    2) 暴露 window.__bridge 供 Agent 用 evaluate_script 读写页面状态 / 写回查询结果
   *  约定信号类型：
   *    - province_changed / dealer_changed / month_changed  筛选变化（携带查询参数，Agent 据此查 MCP）
   *    - skus_applied / dealers_applied                        Agent 写回后的回执
   *    - submit_requested                                     用户点击提交（Agent 可监听提报）
   */
  const BRIDGE_PREFIX = '[bridge:event]';

  function emit(type, payload) {
    const msg = { type, payload, ts: Date.now() };
    console.log(BRIDGE_PREFIX, JSON.stringify(msg));            // ① console 信号
    document.dispatchEvent(new CustomEvent('agent-bridge', { detail: msg })); // ② DOM 事件
    return msg;
  }

  window.__bridge = {
    // Agent 读取当前页面筛选状态
    getState() {
      return {
        planType: state.planType,
        province: state.province,
        dealerCode: state.dealerCode,
        dealerName: state.dealer?.name || null,
        month: state.month,
        skuCount: state.skus.length,
      };
    },
    // Agent 读当前表格（提报用）
    collectTableData() { return collectTableData(); },
    // Agent 写回经销商列表（结构同 fetchProvinceDealers 返回值 [{code,name,amount,qty}]）
    applyDealers(dealers) {
      const list = dealers || [];
      const prev = state.dealerCode;
      const sel = $('dealerSelect');
      sel.innerHTML = list.map(d => `<option value="${d.code}">${d.name}（${d.code}）</option>`).join('')
        || '<option value="">（该省区暂无经销商）</option>';
      if (list.length) {
        const keep = list.find(d => d.code === prev);
        state.dealerCode = keep ? keep.code : list[0].code;
        state.dealer = keep || list[0];
        sel.value = state.dealerCode;
      }
      emit('dealers_applied', { province: state.province, count: list.length });
      return { ok: true, count: list.length };
    },
    // Agent 写回 SKU 明细（结构同 fetchDealerSkus 返回值 [{code,name,categ,confidence,prob,amount,qty}]）
    applySkus(skus) {
      state.skus = (skus || []).map(s => ({ ...s, confirmQty: s.confirmQty ?? s.qty }));
      renderAll();
      emit('skus_applied', { dealerCode: state.dealerCode, count: state.skus.length });
      return { ok: true, count: state.skus.length };
    },
    // 页面主动向 Agent 发信号
    request(event, payload) { return emit(event, payload); },
    // 握手，供 Agent 探测桥是否就绪
    ping() { return { ok: true, ready: true, ts: Date.now() }; },
  };

  // 页面交互 → 自动发信号（在 initSelectors 之后调用，state 已更新）
  function hookSignals() {
    $('dealerSelect').addEventListener('change', () => {
      emit('dealer_changed', { province: state.province, dealerCode: state.dealerCode, dealerName: state.dealer?.name, month: state.month });
    });
    $('provinceSelect').addEventListener('change', () => {
      emit('province_changed', { province: state.province, month: state.month });
    });
    $('monthSelect').addEventListener('change', () => {
      emit('month_changed', { month: state.month, province: state.province, dealerCode: state.dealerCode });
    });
  }

  /* ---------- ⑩ 工具 ---------- */
  let toastTimer;
  function toast(msg, isErr) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.toggle('err', !!isErr);
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
  }

  /* ---------- 启动 ---------- */
  initSelectors();
  hookSignals();
  reloadDealers();

  $('submit').addEventListener('click', () => {
    emit('submit_requested', { ...state.dealer, month: state.month, skuCount: state.skus.length });
    submitToSystem();
  });
  $('approval').addEventListener('click', () => toast('线上点击后进入独立的销售计划审批页。'));
  </script>
</body>
</html>
