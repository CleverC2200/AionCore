name: Handoff verified Core build to AionUi
on:
  workflow_run:
    workflows: ["🔨 Manual Build"]
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: aionui-handoff-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  handoff:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # workflow_run has elevated privileges; execute only trusted default-branch code.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Dispatch opted-in platform
        env:
          GH_TOKEN: ${{ github.token }}
          AIONUI_DISPATCH_TOKEN: ${{ secrets.AIONUI_DISPATCH_TOKEN }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          python scripts/aionui-handoff.py dispatch "$SOURCE_RUN_ID"
